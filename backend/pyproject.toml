[project]
name = "personal-memory-ai"
version = "0.1.0"
description = "Employee personal memory AI conversation platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "passlib>=1.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "celery>=5.4",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "test-data*", "tests*", "alembic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
